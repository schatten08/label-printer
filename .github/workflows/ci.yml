name: Lint & Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check Windows GUI source
        run: python -m py_compile "src/windows_version/print_gui.py"

      - name: Compile-check macOS GUI source
        run: python -m py_compile "src/mac_version/print_gui_mac.py"
